version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: miya-dairy-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-miya_dairy}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - miya-network

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: miya-dairy-backend
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-miya_dairy}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      UPLOAD_DIR: /app/uploads
      ML_MODEL_PATH: /app/models/mobilenet-v2.onnx
      NODE_ENV: ${NODE_ENV:-development}
    volumes:
      - uploads:/app/uploads
      - ml_models:/app/models
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - miya-network
    command: npm run start:prod

  nginx:
    image: nginx:alpine
    container_name: miya-dairy-nginx
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./packages/frontend-public/dist:/usr/share/nginx/html/public:ro
      - ./packages/frontend-admin/dist:/usr/share/nginx/html/admin:ro
      - uploads:/usr/share/nginx/html/uploads:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - miya-network

volumes:
  postgres_data:
  uploads:
  ml_models:

networks:
  miya-network:
    driver: bridge
